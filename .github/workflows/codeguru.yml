name: Analyze with CodeGuru Reviewer

# NOTE: In YAML 1.1, bare `on` is parsed as boolean `true`.
# Quoting it ensures correct interpretation as the GitHub Actions trigger key.
"on":
  push:
  workflow_dispatch: # This allows manual triggering of the action through the GitHub UI.

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build:
    name: Analyze with CodeGuru Reviewer
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      id: iam-role
      continue-on-error: true
      # TODO: Update role-to-assume to an IAM role that trusts this fork's GitHub Actions OIDC provider.
      #       The current role was created for the original aws-samples repo and will fail here.
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::048169001733:role/GuruGitHubCICDRole
        aws-region: us-west-2

    - name: Checkout repository
      uses: actions/checkout@v4
      if: steps.iam-role.outcome == 'success'
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      if: steps.iam-role.outcome == 'success'
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: temurin

    - name: Build project
      if: steps.iam-role.outcome == 'success'
      run: mvn compile -DskipTests

    - name: CodeGuru Reviewer
      uses: aws-actions/codeguru-reviewer@v1.1
      if: steps.iam-role.outcome == 'success'
      continue-on-error: false
      with:
        # TODO: Replace with an S3 bucket in your own AWS account.
        #       The current bucket belongs to the original aws-samples account.
        s3_bucket: codeguru-reviewer-github-profiler-demo-048169001733-uw2
        build_path: ./target/classes

    - name: Store SARIF file
      if: steps.iam-role.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: SARIF_recommendations
        path: ./codeguru-results.sarif.json

    - name: Upload review result
      if: steps.iam-role.outcome == 'success'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codeguru-results.sarif.json
